# One-click demo on Render (https://render.com): New + > Blueprint > pick this repository.
# Creates a free PostgreSQL database and the game server (web app included). DEMO ONLY: development
# mode with the development and demo question banks; production refuses both (docs/DEMO_ONLINE.md).
databases:
  - name: quiznight-db
    plan: free
    databaseName: quizparty_dev
    user: quizparty

services:
  - type: web
    name: quiznight-demo
    runtime: docker
    plan: free
    dockerfilePath: ./infra/deployment/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quiznight-db
          property: connectionString
      - key: PORT
        value: '8080'
      - key: NODE_ENV
        value: development
      - key: QP_ALLOW_DEV_SEED
        value: '1'
      - key: QP_SEED_DEV
        value: '1'
      - key: QP_SEED_DEMO
        value: '1'
      - key: LOG_LEVEL
        value: warn
      # Gusto Board Game look (build-time; remove these three lines for the standard QuizNight look).
      - key: VITE_DEFAULT_THEME
        value: gusto
      - key: VITE_VENUE_NAME
        value: Gusto Board Game
      - key: VITE_VENUE_CREDIT
        value: by Eren Ünal
      # Venue mode (ADR-0024, docs/VENUE.md): metered café tables, the /staff desk, winner rewards.
      # It is NOT an environment variable: switch the database flag `venue.sessions` on in the admin
      # console (/admin -> Bayraklar) after creating the venue under /admin -> Mekanlar. Off by default.
      # VENUE_MINUTE_MS only shortens a metered minute for tests and demos (production refuses it);
      # leave it unset for real tables.
      # - key: VENUE_MINUTE_MS
      #   value: '60000'
