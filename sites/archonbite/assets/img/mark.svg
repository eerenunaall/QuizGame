<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Archonbite">
  <!-- Archonbite mark: an arch (ARCHon) whose legs end in fangs, with three bite marks out of the right shoulder (BITE)
       and a gem set in the opening. Original artwork made for this site. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#ffe9b0"/>
      <stop offset="0.45" stop-color="#f1b445"/>
      <stop offset="1" stop-color="#b9740f"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#ffcf6b"/>
    </linearGradient>
    <mask id="bite">
      <rect width="64" height="64" fill="#fff"/>
      <circle cx="53.5" cy="11.5" r="4.6" fill="#000"/>
      <circle cx="57.6" cy="19" r="3.9" fill="#000"/>
      <circle cx="47" cy="6.2" r="3.4" fill="#000"/>
    </mask>
  </defs>
  <g mask="url(#bite)">
    <path fill="url(#g)" d="M6 52V30a26 26 0 0 1 52 0v22l-7 10-7-10V30a12 12 0 0 0-24 0v22l-7 10z"/>
  </g>
  <path fill="url(#gem)" d="M32 26l5 7-5 8-5-8z"/>
</svg>
